<!DOCTYPE html>
<html>
<head>
    <title>Tela de Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ae3171, #8d0e23);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login{
            background: rgb(255, 157, 157);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            background: #fc25aa92;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #5d1111;
        }
    </style>
</head>

<body>

<div class="login">
    <h2>𝙵𝙰𝚉𝙴𝚁 𝙻𝙾𝙶𝙸𝙽</h2>

    <input type="text" placeholder="Usuário">
    <input type="password" placeholder="Senha">

    <button onclick="window.location.href='home.html'">
        𝑬𝒏𝒕𝒓𝒂𝒓
    </button>
</div>

</body>
</html>
